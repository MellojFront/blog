[project]
name = "backend"
version = "0.1.0"
description = "my blog pet-proj"
readme = "README.md"
authors = [
    { name = "melloj", email = "mellojprod@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.5",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
