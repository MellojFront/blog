{% for post in posts %}
<article>
  <header>
    <hgroup>
      <h1>{{ post.title }}</h1>
      <p><small>Автор: {{ post.autor }} • Опубликовано: {{ post.date_posted }}</small></p>
    </hgroup>
  </header>

  <div>{{ post.content }}</div>

  {% if post.tag %}
  <footer>
    <div class="post-tags">
      {% for t in post.tag %}
        <a href="/?tag={{ t }}"><small>#{{ t }}</small></a>
      {% endfor %}
    </div>
  </footer>
  {% endif %}
</article>
{% endfor %}
