<!-- templates/components/article_view.html -->
{% if post %}
  <article>
    <header>
      <hgroup>
        <h1>{{ post.title }}</h1>
        <p><small>Опубликовано: {{ post.created_at }}</small></p>
      </hgroup>
    </header>

    <!-- Текст статьи (safe нужен, если внутри будут HTML-теги заголовков для оглавления) -->
    <div class="article-body">
      {{ post.content | safe }}
    </div>
  </article>
{% else %}
  <article>
    <p>Пока нет ни одной статьи. Нажмите «Новая статья», чтобы написать первую!</p>
  </article>
{% endif %}
