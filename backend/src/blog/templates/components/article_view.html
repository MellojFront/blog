<div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
    <button onclick="document.getElementById('create-post-modal').showModal()">
        + Добавить пост
    </button>
</div>
{% for post in posts %}
<article>
  <header>
    <hgroup>
      <h1>{{ post.title }}</h1>
      <p><small>Автор: {{ post.author }} • Опубликовано: {{ post.date_posted }}</small></p>
    </hgroup>
  </header>

  <div>{{ post.content }}</div>

  {% if post.tag %}
  <footer>
    <div class="post-tags">
      {% for t in post.tag %}
        <a href="/?tag={{ t }}"><small>#{{ t }}</small></a>
      {% endfor %}
    </div>
  </footer>
  {% endif %}
</article>
{% endfor %}
