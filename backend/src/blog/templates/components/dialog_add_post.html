<dialog id="create-post-modal">
  <article style="max-width: 860px; width: 95%">
    <header>
      <button
        aria-label="Close"
        rel="prev"
        onclick="document.getElementById('create-post-modal').close()"
      ></button>
      <strong>Новый пост</strong>
    </header>

    <form action="/posts" method="post">
      <input
        type="text"
        name="title"
        placeholder="Введите название поста..."
        required
      />


      {% set initial_content = '' %} 
      {% include "components/md_editor.html" %}

      <!-- Шаблоны тегов -->
      {% set initial_tags = '' %}
      {% include "components/tags_input.html" %}

      <!-- Кнопка отправки справа внизу -->
      <footer style="display: flex; justify-content: flex-end">
        <button type="submit" style="width: auto; margin-bottom: 0">
          Создать пост
        </button>
      </footer>
    </form>
  </article>
</dialog>

<script>
  const modal = document.getElementById("create-post-modal");

  // Закрытие при клике на тёмный фон вокруг модалки
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.close();
  });

  // Подстановка тега по клику
  function addTag(tag) {
    const input = document.getElementById("tags-input");
    const tags = input.value
      .split(",")
      .map((t) => t.trim())
      .filter(Boolean);
    if (!tags.includes(tag)) {
      tags.push(tag);
      input.value = tags.join(", ");
    }
  }

  function wrapText(textareaId, openTag, closeTag) {
    const textarea = document.getElementById(textareaId);
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selectedText = textarea.value.substring(start, end);

    const replacement = openTag + (selectedText || "текст") + closeTag;
    textarea.setRangeText(replacement, start, end, "select");
    textarea.focus();
  }

  const quill = new Quill("#quill-editor", {
    theme: "snow",
    placeholder: "Напишите статью...",
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ["bold", "italic", "strike", "blockquote", "code-block"],
        [{ align: [] }],
        [{ list: "ordered" }, { list: "bullet" }],
        ["link", "clean"],
      ],
    },
  });

  const form = document.querySelector("#quill-editor").closest("form");
  form.addEventListener("submit", () => {
    document.getElementById("hidden-content").value = quill.root.innerHTML;
  });
</script>
