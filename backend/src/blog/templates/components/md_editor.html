<div class="obsidian-editor">
  <div class="editor-toolbar">
    <!-- Заголовок и базовый текст -->
    <button type="button" class="outline secondary" onclick="mdAction(this, '\n## ', '')" title="Заголовок H2">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '**', '**')" title="Жирный (Ctrl+B)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 12a4 4 0 0 0 0-8H6v8"/><path d="M15 20a4 4 0 0 0 0-8H6v8Z"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '*', '*')" title="Курсив (Ctrl+I)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '<u>', '</u>')" title="Подчёркнутый">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" x2="20" y1="20" y2="20"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '~~', '~~')" title="Зачёркнутый">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></svg>
    </button>

    <span class="toolbar-divider"></span>

    <!-- Фирменные элементы Pico CSS -->
    <button type="button" class="outline secondary" onclick="mdAction(this, '<mark>', '</mark>')" title="Выделить маркером (==текст==)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '<kbd>', '</kbd>')" title="Клавиша / сочетание">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="20" height="16" x="2" y="4" rx="2" ry="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M7 16h10"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '<sub>', '</sub>')" title="Нижний индекс">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m4 5 8 8"/><path d="m12 5-8 8"/><path d="M20 19h-4c0-1.5.44-2 1.5-2.5S20 15.33 20 14c0-.47-.17-.93-.48-1.29a2.11 2.11 0 0 0-2.62-.44c-.42.24-.74.62-.9 1.07"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '<sup>', '</sup>')" title="Верхний индекс">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m4 19 8-8"/><path d="m12 19-8-8"/><path d="M20 12h-4c0-1.5.442-2 1.5-2.5S20 8.33 20 7.004c0-.472-.17-.93-.484-1.29a2.105 2.105 0 0 0-2.617-.436c-.42.239-.738.614-.899 1.06"/></svg>
    </button>

    <span class="toolbar-divider"></span>

    <!-- Код, цитата, ссылка -->
    <button type="button" class="outline secondary" onclick="mdAction(this, '`', '`')" title="Встроенный код">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '\n```\n', '\n```\n')" title="Блок кода">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m10 10-2 2 2 2"/><path d="m14 14 2-2-2-2"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '\n> ', '')" title="Цитата">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '[', '](https://)')" title="Ссылка">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </button>

    <span class="toolbar-divider"></span>

    <!-- Выравнивание -->
    <button type="button" class="outline secondary" onclick="mdAction(this, '<div align=&quot;left&quot;>', '</div>')" title="По левому краю">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="21" x2="3" y1="6" y2="6"/><line x1="15" x2="3" y1="12" y2="12"/><line x1="17" x2="3" y1="18" y2="18"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '<div align=&quot;center&quot;>', '</div>')" title="По центру">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="21" x2="3" y1="6" y2="6"/><line x1="17" x2="7" y1="12" y2="12"/><line x1="19" x2="5" y1="18" y2="18"/></svg>
    </button>
    <button type="button" class="outline secondary" onclick="mdAction(this, '<div align=&quot;right&quot;>', '</div>')" title="По правому краю">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="21" x2="3" y1="6" y2="6"/><line x1="21" x2="9" y1="12" y2="12"/><line x1="21" x2="7" y1="18" y2="18"/></svg>
    </button>

    <button type="button" class="outline secondary preview-toggle" style="margin-left: auto;" onclick="toggleObsidianPreview(this)" title="Режим чтения / редактирования">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>



  <textarea name="content" rows="9" placeholder="Пишите как в Obsidian: **жирный**, *курсив*, ==маркер==, ~~зачёркнутый~~..." required onkeydown="mdHotkeys(event, this)">{{ initial_content or '' }}</textarea>
  <div class="editor-preview" style="display: none;"></div>
</div>
